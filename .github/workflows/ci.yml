name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check scripts
        shell: bash
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: Installer dry run (no tools, no login)
        shell: pwsh
        run: ./install.ps1 -HomeDir "$env:RUNNER_TEMP/home" -SkipTools -SkipLogin
